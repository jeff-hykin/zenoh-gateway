[package]
name = "my-app"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
zenoh-gateway = { version = "0.4.1", git = "https://github.com/jeff-hykin/zenoh-gateway", rev = "63b72ddd507fd31cd91dc1c3cc350336ebe08b89", features = ["client"] }
# the dimos / ROS 2 codecs and hardware encoders: VideoToolbox on macOS, GStreamer (opened at runtime) on Linux
zenoh-dimos-codecs = { version = "0.2.0", git = "https://github.com/jeff-hykin/zenoh-dimos-codecs", rev = "013142da5ba4777a6d00993acc85148d0fe674ce", features = ["videotoolbox", "gstreamer"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
anyhow = "1"
