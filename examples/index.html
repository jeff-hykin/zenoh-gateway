<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>zenoh-web example</title>
    <style>
        :root {
            color-scheme: light dark;
            --background: #f6f6f4;
            --surface: #ffffff;
            --text: #1d1d1b;
            --muted: #6b6b66;
            --line: #d9d9d4;
            --accent: #2f6fdb;
            --good: #24883b;
            --warn: #b97800;
            --bad: #c23b32;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --background: #151515;
                --surface: #1f1f1e;
                --text: #e8e8e4;
                --muted: #9a9a94;
                --line: #363634;
                --accent: #79a6f2;
                --good: #5cc46f;
                --warn: #e0a83a;
                --bad: #ec6a5f;
            }
        }
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--background); color: var(--text); font: 14px/1.4 system-ui, sans-serif; }
        header { display: flex; flex-wrap: wrap; gap: 16px; align-items: baseline; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--surface); }
        header strong { font-size: 16px; }
        .muted { color: var(--muted); }
        .mono { font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
        #connection-state { font-weight: 600; }
        #connection-state[data-state="connected"] { color: var(--good); }
        #connection-state[data-state="degraded"] { color: var(--warn); }
        #connection-state[data-state="lost"] { color: var(--bad); }
        main { display: grid; grid-template-columns: minmax(260px, 340px) 1fr; gap: 16px; padding: 16px; }
        @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
        section.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin-bottom: 16px; }
        section.panel h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin: 0 0 8px; }
        .row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
        .row > input[type="text"], .row > select { flex: 1; min-width: 0; }
        input, select, button { font: inherit; color: inherit; }
        input[type="text"], input[type="number"], select { background: var(--background); border: 1px solid var(--line); border-radius: 4px; padding: 4px 6px; }
        button { background: var(--accent); color: #fff; border: 0; border-radius: 4px; padding: 5px 10px; cursor: pointer; }
        button.secondary { background: transparent; color: var(--muted); border: 1px solid var(--line); }
        #topic-list { list-style: none; margin: 0; padding: 0; max-height: 320px; overflow: auto; }
        #topic-list li button { display: block; width: 100%; text-align: left; background: transparent; color: var(--text); padding: 4px 6px; border-radius: 4px; word-break: break-all; }
        #topic-list li button:hover { background: var(--background); }
        #topic-list .sources { color: var(--muted); font-size: 11px; }
        dl.stats { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; margin: 0; font-variant-numeric: tabular-nums; }
        dl.stats dt { color: var(--muted); }
        dl.stats dd { margin: 0; text-align: right; }
        table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
        th, td { text-align: left; padding: 3px 6px; border-bottom: 1px solid var(--line); }
        td.key { word-break: break-all; }
        #streams { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 16px; align-content: start; }
        .stream { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
        .stream-head { display: flex; gap: 8px; align-items: baseline; }
        .stream-head .key { flex: 1; word-break: break-all; }
        .stream-view video, .stream-view canvas { display: block; width: 100%; max-height: 360px; object-fit: contain; background: #000; border-radius: 4px; }
        .stream-view canvas.pointcloud { aspect-ratio: 4 / 3; cursor: grab; touch-action: none; }
        .stream-view .raw { font-size: 22px; font-variant-numeric: tabular-nums; }
        .stream-error { color: var(--bad); }
        .controls { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 8px; align-items: center; font-size: 12px; }
        .controls input[type="range"] { width: 100%; }
        .controls output { min-width: 3em; text-align: right; font-variant-numeric: tabular-nums; }
        .stream-stats { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
    </style>
</head>
<body>
    <header>
        <strong>zenoh-web</strong>
        <span id="connection-state" data-state="connecting">connecting</span>
        <span class="muted mono" id="bridge-url"></span>
        <span class="muted" id="header-rtt"></span>
    </header>
    <main>
        <div>
            <section class="panel">
                <h2>Topics</h2>
                <div class="row">
                    <input type="text" id="topic-filter" value="**" aria-label="key expression filter">
                    <button id="refresh-topics">Refresh</button>
                </div>
                <div class="muted" id="topic-status">not loaded</div>
                <ul id="topic-list"></ul>
            </section>
            <section class="panel">
                <h2>Subscribe</h2>
                <div class="row"><input type="text" id="subscribe-key" placeholder="key expression" aria-label="key expression"></div>
                <div class="row">
                    <select id="subscribe-codec" aria-label="codec"></select>
                    <button id="subscribe-button">Add</button>
                </div>
                <div class="muted" id="subscribe-error"></div>
            </section>
            <section class="panel">
                <h2>Connection (z.bridgeStats)</h2>
                <dl class="stats" id="connection-stats"></dl>
            </section>
        </div>
        <div>
            <section class="panel">
                <h2>z.stats</h2>
                <table>
                    <thead><tr><th>key</th><th>received</th><th>dropped</th><th>backlog</th><th>quality</th><th>Hz granted</th><th>budget</th></tr></thead>
                    <tbody id="key-stats"></tbody>
                </table>
            </section>
            <div id="streams"></div>
        </div>
    </main>
    <template id="stream-template">
        <article class="stream">
            <div class="stream-head">
                <span class="key mono"></span>
                <span class="codec muted mono"></span>
                <button class="secondary close">close</button>
            </div>
            <div class="stream-view"></div>
            <div class="stream-error"></div>
            <div class="stream-stats"></div>
            <div class="controls">
                <span>minQuality</span><input type="range" name="minQuality" min="0" max="1" step="0.05" value="0"><output></output>
                <span>maxQuality</span><input type="range" name="maxQuality" min="0" max="1" step="0.05" value="1"><output></output>
                <span>qualityToHzTradeoff</span><input type="range" name="qualityToHzTradeoff" min="0" max="1" step="0.05" value="0.5"><output></output>
                <span>bandwidthPriority</span><input type="range" name="bandwidthPriority" min="0" max="4" step="0.25" value="1"><output></output>
                <span>maxHz</span><input type="range" name="maxHz" min="0" max="60" step="1" value="0"><output></output>
                <span>priority</span><select name="priority"></select><span></span>
            </div>
        </article>
    </template>
    <script type="module" src="./app.js"></script>
</body>
</html>
