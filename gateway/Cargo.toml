[package]
name = "zenoh-gateway"
version = "0.6.6"
edition = "2024"
rust-version = "1.88"
description = "View and drive a zenoh system from a browser over WebRTC (data channels, H.264 video, bandwidth allocation, deadmen): an embeddable server with pluggable codecs"
repository = "https://github.com/jeff-hykin/zenoh-gateway"
license-file = "../LICENSE"
readme = "../README.md"
keywords = ["zenoh", "webrtc", "robotics", "browser", "bridge"]
categories = ["network-programming", "web-programming", "science::robotics"]
# only what building the library needs (no examples or artifacts)
include = ["/src/**/*.rs", "/Cargo.toml"]


[dependencies]
# 1.7.0 through 1.10.1 deadlock when the admin space answers a query during a declaration: keep it off (the default)
zenoh = "=1.10.1"
zenoh-ext = { version = "=1.10.1", features = ["unstable"] }
# webrtc-rs with small fixes, renamed so they reach crates that depend on zenoh-gateway (github.com/jeff-hykin/webrtc-rs-zenoh-web)
webrtc = { package = "zenoh-web-webrtc", version = "=0.21.0-zw.4" }
rtc = { package = "zenoh-web-rtc", version = "=0.21.0-zw.4" }
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["fs", "cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
base64 = "0.22"
async-trait = "0.1"
anyhow = "1"
log = "0.4"
futures = "0.3"
# locks that a panic cannot poison: one panicked task must not take every later lock() down with it
parking_lot = "0.12"
# subscribe option compress: "zstd" (builds its C sources)
zstd = "0.13"
# audio tracks: libopus transpiled to Rust (no C toolchain, so it cross-compiles like the rest)
unsafe-libopus = "0.2"
# coturn time-limited TURN credentials (HMAC-SHA1; already in the tree through webrtc)
hmac = "0.12"
sha1 = "0.10"
# H.264 video (openh264 builds its C sources)
openh264 = "0.9"
# set_option, to change the bitrate without a keyframe
openh264-sys2 = "0.9"
# ServerBuilder::tls_pem / tls_files: HTTPS (rustls with ring, both already in the tree through zenoh)
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
# feature `av1`: the built-in AV1 encoder
rav1e = { version = "0.8", default-features = false, features = ["threading"], optional = true }
# feature `client`: POST /offer
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }

[features]
default = ["av1"]
# channel video-av1 out of the box: rav1e, pure Rust
av1 = ["dep:rav1e"]
# zenoh_gateway::client: a Rust client that connects to a server as a browser does (e.g. for a relay)
client = ["dep:reqwest"]
# zenoh_gateway::CloudflareTurn: TURN credentials from Cloudflare's API
cloudflare = ["dep:reqwest"]

[dev-dependencies]
# decodes a real camera frame for the ignored bench_stages
zune-jpeg = "0.5"
# a self-signed certificate for the HTTPS test
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }

[[test]]
name = "client"
required-features = ["client"]

[[test]]
name = "backpressure"
required-features = ["client"]

[[test]]
name = "leak"
required-features = ["client"]

[[example]]
name = "relay_sketch"
required-features = ["client"]

[patch.crates-io]
# zenoh 1.10.1 plus a routing fix (puts dropped after a publisher is undeclared): https://github.com/jeff-hykin/zenoh-vendor
zenoh = { git = "https://github.com/jeff-hykin/zenoh-vendor", tag = "zenoh-1.10.1-patch.1" }
