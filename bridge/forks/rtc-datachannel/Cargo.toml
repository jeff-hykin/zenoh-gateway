# Fork of the crates.io package, see PATCHES.md. Normalized by cargo when upstream published it:
#
# When uploading crates to the registry Cargo will automatically
# "normalize" Cargo.toml files for maximal compatibility
# with all versions of Cargo and also rewrite `path` dependencies
# to registry (e.g., crates.io) dependencies.
#
# If you are reading this file be aware that the original Cargo.toml
# will likely look very different (and much more reasonable).
# See Cargo.toml.orig for the original contents.

[package]
edition = "2024"
name = "zenoh-web-rtc-datachannel"
version = "0.21.0-zw.2"
authors = ["Rain Liu <yliu@webrtc.rs>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Fork of rtc-datachannel 0.21.0 with fixes for zenoh-web (see PATCHES.md)"
documentation = "https://docs.rs/zenoh-web-rtc-datachannel"
readme = "README.md"
keywords = [
    "sansio",
    "networking",
    "protocols",
]
categories = ["network-programming"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/jeff-hykin/zenoh-web"
resolver = "2"

[lib]
name = "rtc_datachannel"
path = "src/lib.rs"

[dependencies.bytes]
version = "1.12.0"

[dependencies.log]
version = "0.4.33"

[dependencies.sansio]
version = "1"

[dependencies.sctp]
package = "zenoh-web-rtc-sctp"
version = "=0.21.0-zw.2"
path = "../rtc-sctp"

[dependencies.shared]
version = "0.21.0"
features = ["marshal"]
default-features = false
package = "rtc-shared"

