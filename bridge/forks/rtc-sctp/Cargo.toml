# Fork of the crates.io package, see PATCHES.md. Normalized by cargo when upstream published it:
#
# When uploading crates to the registry Cargo will automatically
# "normalize" Cargo.toml files for maximal compatibility
# with all versions of Cargo and also rewrite `path` dependencies
# to registry (e.g., crates.io) dependencies.
#
# If you are reading this file be aware that the original Cargo.toml
# will likely look very different (and much more reasonable).
# See Cargo.toml.orig for the original contents.

[package]
edition = "2024"
name = "zenoh-web-rtc-sctp"
version = "0.21.0-zw.2"
authors = ["Rain Liu <yliu@webrtc.rs>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Fork of rtc-sctp 0.21.0 with fixes for zenoh-web (see PATCHES.md)"
documentation = "https://docs.rs/zenoh-web-rtc-sctp"
readme = "README.md"
keywords = [
    "sansio",
    "networking",
    "protocols",
]
categories = ["network-programming"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/jeff-hykin/zenoh-web"
resolver = "2"

[features]
bench = []

[lib]
name = "rtc_sctp"
path = "src/lib.rs"

[dependencies.bytes]
version = "1.12.0"

[dependencies.crc32c]
version = "0.6"

[dependencies.log]
version = "0.4.33"

[dependencies.rand]
version = "0.10.1"

[dependencies.rustc-hash]
version = "2"

[dependencies.shared]
version = "0.21.0"
features = []
default-features = false
package = "rtc-shared"

[dependencies.slab]
version = "0.4.9"

[dependencies.thiserror]
version = "2.0.18"

# upstream's, so the unit tests (including the zenoh-web patches' tests) run: `cargo test` in this directory
[dev-dependencies.assert_matches]
version = "1.5.0"

[dev-dependencies.lazy_static]
version = "1.4.0"

[lints.rust.unexpected_cfgs]
level = "warn"
priority = 0
check-cfg = ["cfg(fuzzing)"]
