# Fork of the crates.io package, see PATCHES.md. Normalized by cargo when upstream published it:
#
# When uploading crates to the registry Cargo will automatically
# "normalize" Cargo.toml files for maximal compatibility
# with all versions of Cargo and also rewrite `path` dependencies
# to registry (e.g., crates.io) dependencies.
#
# If you are reading this file be aware that the original Cargo.toml
# will likely look very different (and much more reasonable).
# See Cargo.toml.orig for the original contents.

[package]
edition = "2024"
name = "zenoh-web-webrtc"
version = "0.21.0-zw.2"
authors = ["Rain Liu <yliu@webrtc.rs>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Fork of webrtc 0.21.0 with fixes for zenoh-web (see PATCHES.md)"
documentation = "https://docs.rs/zenoh-web-webrtc"
readme = "README.md"
keywords = [
    "sansio",
    "networking",
    "protocols",
]
categories = ["network-programming"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/jeff-hykin/zenoh-web"

[features]
crypto-aws-lc-rs = ["rtc/crypto-aws-lc-rs"]
crypto-ring = ["rtc/crypto-ring"]
default = [
    "runtime-tokio",
    "crypto-ring",
]
runtime-mock = []
runtime-smol = ["dep:smol"]
runtime-tokio = ["dep:tokio"]

[lib]
name = "webrtc"
path = "src/lib.rs"

[dependencies.async-broadcast]
version = "0.7.2"

[dependencies.async-channel]
version = "2.5.0"

[dependencies.async-trait]
version = "0.1.89"

[dependencies.bytes]
version = "1.12.0"

[dependencies.event-listener]
version = "5.4.1"

[dependencies.futures]
version = "0.3.32"

[dependencies.log]
version = "0.4.33"

[dependencies.quinn-udp]
version = "0.6.1"
features = ["log"]
default-features = false

[dependencies.rtc]
package = "zenoh-web-rtc"
version = "=0.21.0-zw.2"
path = "../rtc"
default-features = false

[dependencies.smol]
version = "2.0.2"
optional = true

[dependencies.tokio]
version = "1.52.3"
features = [
    "net",
    "time",
    "sync",
    "rt",
    "rt-multi-thread",
]
optional = true

