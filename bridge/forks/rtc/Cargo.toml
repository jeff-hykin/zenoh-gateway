# Fork of the crates.io package, see PATCHES.md. Normalized by cargo when upstream published it:
#
# When uploading crates to the registry Cargo will automatically
# "normalize" Cargo.toml files for maximal compatibility
# with all versions of Cargo and also rewrite `path` dependencies
# to registry (e.g., crates.io) dependencies.
#
# If you are reading this file be aware that the original Cargo.toml
# will likely look very different (and much more reasonable).
# See Cargo.toml.orig for the original contents.

[package]
edition = "2024"
name = "zenoh-web-rtc"
version = "0.21.0-zw.1"
authors = ["Rain Liu <yliu@webrtc.rs>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Fork of rtc 0.21.0 with fixes for zenoh-web (see PATCHES.md)"
documentation = "https://docs.rs/zenoh-web-rtc"
readme = "README.md"
keywords = [
    "sansio",
    "networking",
    "protocols",
]
categories = ["network-programming"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/jeff-hykin/zenoh-web"
resolver = "2"

[features]
crypto-aws-lc-rs = [
    "crypto/crypto-aws-lc-rs",
    "dtls/crypto-aws-lc-rs",
    "rustls/aws-lc-rs",
    "rcgen/aws_lc_rs",
    "ice/crypto-aws-lc-rs",
    "stun/crypto-aws-lc-rs",
    "srtp/crypto-aws-lc-rs",
    "turn/crypto-aws-lc-rs",
]
crypto-ring = [
    "crypto/crypto-ring",
    "dtls/crypto-ring",
    "rustls/ring",
    "rcgen/ring",
    "ice/crypto-ring",
    "stun/crypto-ring",
    "srtp/crypto-ring",
    "turn/crypto-ring",
]
default = ["crypto-ring"]

[lib]
name = "rtc"
path = "src/lib.rs"

[dependencies.bytes]
version = "1.12.0"

[dependencies.crypto]
version = "0.21.0"
default-features = false
package = "rtc-crypto"

[dependencies.datachannel]
package = "zenoh-web-rtc-datachannel"
version = "=0.21.0-zw.1"
path = "../rtc-datachannel"

[dependencies.dtls]
version = "0.21.0"
default-features = false
package = "rtc-dtls"

[dependencies.hex]
version = "0.4.3"

[dependencies.ice]
version = "0.21.0"
default-features = false
package = "rtc-ice"

[dependencies.interceptor]
version = "0.21.0"
package = "rtc-interceptor"

[dependencies.log]
version = "0.4.33"

[dependencies.mdns]
version = "0.21.0"
package = "rtc-mdns"

[dependencies.media]
version = "0.21.0"
package = "rtc-media"

[dependencies.pem]
version = "3.0.3"

[dependencies.rand]
version = "0.10.1"

[dependencies.rcgen]
version = "0.14.8"
features = ["pem"]
default-features = false

[dependencies.rtcp]
version = "0.21.0"
package = "rtc-rtcp"

[dependencies.rtp]
version = "0.21.0"
package = "rtc-rtp"

[dependencies.rustls]
version = "0.23.27"
features = ["std"]
default-features = false

[dependencies.sansio]
version = "1"

[dependencies.sctp]
package = "zenoh-web-rtc-sctp"
version = "=0.21.0-zw.1"
path = "../rtc-sctp"

[dependencies.sdp]
version = "0.21.0"
package = "rtc-sdp"

[dependencies.serde]
version = "1.0.228"
features = ["derive"]

[dependencies.serde_json]
version = "1.0.114"

[dependencies.shared]
version = "0.21.0"
features = [
    "marshal",
    "replay",
]
default-features = false
package = "rtc-shared"

[dependencies.srtp]
version = "0.21.0"
default-features = false
package = "rtc-srtp"

[dependencies.stun]
version = "0.21.0"
default-features = false
package = "rtc-stun"

[dependencies.turn]
version = "0.21.0"
default-features = false
package = "rtc-turn"

[dependencies.unicase]
version = "2.8"

[dependencies.url]
version = "2.5.0"

[dependencies.x509-parser]
version = "0.16.0"

