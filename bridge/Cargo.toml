[package]
name = "zenoh-web"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "View and drive a zenoh system from a browser over WebRTC (data channels, H.264 video, bandwidth allocation, deadmen); a CLI and an embeddable server with pluggable codecs"
repository = "https://github.com/jeff-hykin/zenoh-web"
readme = "../README.md"
keywords = ["zenoh", "webrtc", "robotics", "browser", "bridge"]
categories = ["network-programming", "web-programming", "science::robotics", "command-line-utilities"]
# only what building the library and the CLI needs (no fixtures, examples, forks or artifacts)
include = ["/src/**/*.rs", "/Cargo.toml"]

[[bin]]
name = "zenoh-web"
path = "src/main.rs"

[dependencies]
zenoh = "1.10"
zenoh-ext = { version = "1.10", features = ["unstable"] }
# forks of webrtc-rs with small fixes, renamed so they reach crates that depend on zenoh-web (see forks/README.md)
webrtc = { package = "zenoh-web-webrtc", version = "=0.21.0-zw.1", path = "forks/webrtc" }
rtc = { package = "zenoh-web-rtc", version = "=0.21.0-zw.1", path = "forks/rtc" }
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["fs", "cors"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
base64 = "0.22"
async-trait = "0.1"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
futures = "0.3"
# codecs (pure Rust decoders; openh264 + zstd build their C sources, cross-compiled via zig)
openh264 = "0.9"
jpeg-encoder = "0.6"
zstd = "0.13"
zune-jpeg = "0.5"
png = "0.18"
image-webp = "0.2"
jxl-oxide = "0.12"
