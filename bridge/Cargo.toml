[package]
name = "zenoh-web"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
description = "View and drive a zenoh system from a browser over WebRTC (data channels, H.264 video, bandwidth allocation, deadmen): an embeddable server with pluggable codecs"
repository = "https://github.com/jeff-hykin/zenoh-web"
license-file = "../LICENSE"
readme = "../README.md"
keywords = ["zenoh", "webrtc", "robotics", "browser", "bridge"]
categories = ["network-programming", "web-programming", "science::robotics"]
# only what building the library needs (no examples or artifacts)
include = ["/src/**/*.rs", "/Cargo.toml"]


[dependencies]
# 1.6.2: zenoh 1.7.0 through 1.10.1 deadlock when the admin space answers a query during a declaration
zenoh = "=1.6.2"
zenoh-ext = { version = "=1.6.2", features = ["unstable"] }
# webrtc-rs with small fixes, renamed so they reach crates that depend on zenoh-web (github.com/jeff-hykin/webrtc-rs-zenoh-web)
webrtc = { package = "zenoh-web-webrtc", version = "=0.21.0-zw.2" }
rtc = { package = "zenoh-web-rtc", version = "=0.21.0-zw.2" }
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["fs", "cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
base64 = "0.22"
async-trait = "0.1"
anyhow = "1"
log = "0.4"
futures = "0.3"
# subscribe option compress: "zstd" (builds its C sources)
zstd = "0.13"
# audio tracks: libopus transpiled to Rust (no C toolchain, so it cross-compiles like the rest)
unsafe-libopus = "0.2"
# H.264 video (openh264 builds its C sources)
openh264 = "0.9"

[dev-dependencies]
# decodes a real camera frame for the ignored bench_stages
zune-jpeg = "0.5"

