[package]
name = "zenoh-web"
version = "0.1.0"
edition = "2024"
description = "Minimal zenoh <-> WebRTC data channel bridge"
license = "MIT OR Apache-2.0"

[[bin]]
name = "zenoh-web"
path = "src/main.rs"

[dependencies]
zenoh = "1.10"
zenoh-ext = { version = "1.10", features = ["unstable"] }
webrtc = "0.21.0"
rtc = "0.21.0"
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["fs", "cors"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
base64 = "0.22"
async-trait = "0.1"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
futures = "0.3"

# Vendored with small patches (search "zenoh-web patch"); drop once upstream fixes them:
# - rtc-sctp: RTO_MIN 1 s -> 200 ms, RTO_MAX 60 s -> 3 s (src/association/timer.rs)
# - rtc: apply the peer's DCEP reliability to channels the peer opens (src/peer_connection/handler/sctp.rs)
[patch.crates-io]
rtc-sctp = { path = "vendor/rtc-sctp" }
rtc = { path = "vendor/rtc" }
